<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Social Platform</title>
  <style>
    :root {
      --bg: #edf4f7;
      --panel: #ffffff;
      --soft: #f4f8fb;
      --line: #dce6ee;
      --text: #13202d;
      --muted: #718294;
      --brand: #1d9bf0;
      --green: #19a974;
      --pink: #e94b7b;
      --gold: #f4a62a;
      --purple: #7357ff;
      --shadow: 0 18px 42px rgba(20, 35, 52, .12);
    }

    [data-theme="dark"] {
      --bg: #101923;
      --panel: #172332;
      --soft: #203043;
      --line: #31475d;
      --text: #edf5fb;
      --muted: #9db0c3;
      --shadow: 0 18px 46px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(29, 155, 240, .13), transparent 38%),
        radial-gradient(circle at 12% 80%, rgba(233, 75, 123, .10), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; background: transparent; }

    .app {
      height: 100vh;
      min-height: 720px;
      display: grid;
      grid-template-columns: 86px 318px minmax(0, 1fr) 340px;
      gap: 12px;
      padding: 12px;
    }

    .rail, .sidebar, .workspace, .inspector, .modal {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    .rail {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 10px 8px;
      align-items: center;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 23px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--brand), var(--purple));
    }

    .nav, .rail-bottom { display: grid; gap: 7px; justify-items: center; }

    .icon {
      width: 46px;
      height: 42px;
      border-radius: 8px;
      color: var(--muted);
      display: grid;
      place-items: center;
      position: relative;
      font-size: 18px;
    }

    .icon:hover, .icon.active {
      color: var(--brand);
      background: var(--soft);
    }

    .badge {
      position: absolute;
      top: 2px;
      left: 2px;
      min-width: 18px;
      height: 18px;
      border-radius: 10px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--pink);
      font-size: 11px;
      font-weight: 700;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .top {
      padding: 16px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    h3 { font-size: 15px; }

    .search {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .tab, .chip {
      min-height: 34px;
      border-radius: 8px;
      padding: 0 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .tab.active, .chip.active {
      color: var(--brand);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      background: color-mix(in srgb, var(--brand) 12%, var(--panel));
      font-weight: 700;
    }

    .list {
      overflow: auto;
      padding: 8px;
    }

    .item {
      width: 100%;
      min-height: 70px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 50px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      text-align: right;
    }

    .item:hover, .item.active { background: var(--soft); }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: linear-gradient(135deg, var(--c1), var(--c2));
    }

    .main-text { min-width: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .name { font-weight: 900; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .muted { color: var(--muted); font-size: 13px; }
    .preview { color: var(--muted); font-size: 13px; margin-top: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .workspace {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
    }

    .workspace-head {
      min-height: 74px;
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .profile-line { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .content {
      overflow: auto;
      padding: 18px;
      background:
        linear-gradient(90deg, rgba(29, 155, 240, .05) 1px, transparent 1px),
        linear-gradient(rgba(25, 169, 116, .045) 1px, transparent 1px),
        color-mix(in srgb, var(--soft) 74%, var(--bg));
      background-size: 28px 28px;
    }

    .message {
      max-width: min(70%, 620px);
      margin: 9px 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 10px 12px;
      line-height: 1.55;
      box-shadow: 0 8px 18px rgba(19, 32, 45, .06);
    }

    .message.me {
      margin-right: auto;
      background: color-mix(in srgb, var(--green) 14%, var(--panel));
    }

    .message-tools {
      margin-top: 8px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mini {
      min-height: 25px;
      border-radius: 13px;
      padding: 0 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      background: var(--panel);
    }

    .quick { display: flex; gap: 6px; flex-wrap: wrap; }
    .compose-row { display: grid; grid-template-columns: 44px 44px 1fr 50px; gap: 8px; }
    textarea {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
      outline: 0;
      resize: none;
      padding: 10px 12px;
    }

    .send, .primary {
      min-height: 40px;
      border-radius: 8px;
      padding: 0 14px;
      color: white;
      background: var(--brand);
      font-weight: 800;
    }

    .inspector {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .inspector-top {
      padding: 18px;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .avatar.big { width: 78px; height: 78px; font-size: 28px; }
    .inspector-body { overflow: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }

    .section { display: grid; gap: 8px; }
    .section-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
    .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card {
      min-height: 86px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 11px;
      display: grid;
      gap: 5px;
      align-content: center;
    }

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 16% 18%, rgba(115, 87, 255, .18), transparent 30%),
        radial-gradient(circle at 82% 78%, rgba(29, 155, 240, .18), transparent 30%),
        var(--bg);
    }

    .auth-screen.hidden { display: none; }
    .auth-card {
      width: min(920px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .auth-hero, .auth-form { padding: 28px; display: grid; gap: 14px; align-content: center; }
    .auth-hero { color: white; background: linear-gradient(135deg, var(--brand), var(--purple)); }
    .field { display: grid; gap: 6px; }
    .field span { color: var(--muted); font-size: 13px; }
    .field input, .field select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
      outline: 0;
      padding: 0 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(10, 18, 28, .42);
      backdrop-filter: blur(6px);
    }

    .modal-backdrop.open { display: grid; }
    .modal { width: min(650px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
    .modal-head { padding: 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px; display: grid; gap: 12px; }

    .surface-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .surface-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 14px;
      min-height: 150px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .video-tile {
      min-height: 310px;
      border-radius: 8px;
      color: white;
      padding: 14px;
      display: grid;
      align-content: end;
      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,.58)),
        linear-gradient(135deg, var(--purple), var(--pink));
    }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 74px 300px minmax(0, 1fr); }
      .inspector { display: none; }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; grid-template-columns: 1fr; min-height: 100vh; }
      .rail { grid-template-columns: auto 1fr auto; grid-template-rows: 1fr; }
      .logo { margin: 0; }
      .nav, .rail-bottom { display: flex; overflow: auto; }
      .workspace { min-height: 680px; }
      .message { max-width: 92%; }
      .auth-card { grid-template-columns: 1fr; }
      .surface-grid, .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-hero">
        <div class="logo">N</div>
        <h1>Nova</h1>
        <p>منصة تواصل عالمية تجمع المحادثات، المجتمعات، القنوات، المكالمات، الريلز، الذكاء الاصطناعي، وNova Stars في تجربة واحدة.</p>
      </div>
      <div class="auth-form">
        <h2>تسجيل الدخول</h2>
        <div class="tabs">
          <button class="tab active" data-auth="phone">هاتف</button>
          <button class="tab" data-auth="email">بريد</button>
          <button class="tab" data-auth="guest">ضيف</button>
          <button class="tab" data-auth="oauth">OAuth</button>
        </div>
        <label class="field">
          <span id="authLabel">رقم الهاتف</span>
          <input id="authInput" placeholder="+966 5X XXX XXXX" />
        </label>
        <button class="primary" id="loginBtn">دخول إلى Nova</button>
        <button class="chip" id="guestBtn">الدخول كضيف لمدة 30 يومًا</button>
        <p class="muted" id="guestNotice">سيتم تنبيه الضيف قبل انتهاء الحساب، وبعد 30 يومًا يجب ربط الحساب خلال 15 يومًا.</p>
      </div>
    </div>
  </section>

  <main class="app" data-theme="light">
    <aside class="rail">
      <div class="logo">N</div>
      <nav class="nav" id="mainNav"></nav>
      <div class="rail-bottom">
        <button class="icon" title="الإشعارات" data-surface="notifications">🔔<span class="badge">7</span></button>
        <button class="icon" title="الإدارة" data-surface="admin">⚙</button>
      </div>
    </aside>

    <aside class="sidebar">
      <div class="top">
        <div class="title-row">
          <h1>Nova</h1>
          <button class="icon" id="createBtn" title="إنشاء">＋</button>
        </div>
        <label class="search">
          <span>⌕</span>
          <input id="globalSearch" placeholder="ابحث في Nova" />
        </label>
      </div>
      <div class="tabs" id="filters">
        <button class="tab active" data-filter="all">الكل</button>
        <button class="tab" data-filter="direct">خاص</button>
        <button class="tab" data-filter="group">مجموعات</button>
        <button class="tab" data-filter="channel">قنوات</button>
      </div>
      <div class="list" id="conversationList"></div>
    </aside>

    <section class="workspace">
      <header class="workspace-head">
        <div class="profile-line">
          <div class="avatar" id="activeAvatar" style="--c1:#1d9bf0;--c2:#7357ff">ن</div>
          <div class="main-text">
            <h2 id="activeTitle">Nova Home</h2>
            <p class="muted" id="activeStatus">جاهز للعمل</p>
          </div>
        </div>
        <div class="actions">
          <button class="icon" id="callBtn" title="مكالمة">☎</button>
          <button class="icon" id="videoBtn" title="فيديو">▣</button>
          <button class="icon" id="screenBtn" title="مشاركة شاشة">▤</button>
          <button class="icon" id="aiBtn" title="Nova AI">✦</button>
        </div>
      </header>
      <div class="content" id="content"></div>
      <footer class="composer">
        <div class="quick">
          <button class="chip" data-insert="📎 ملف">ملف</button>
          <button class="chip" data-insert="🖼 صورة">صورة</button>
          <button class="chip" data-insert="🎙 صوت">صوت</button>
          <button class="chip" data-insert="📊 استطلاع">استطلاع</button>
          <button class="chip" data-insert="🌐 ترجمة فورية">ترجمة</button>
          <button class="chip" data-insert="⏱ مجدولة">جدولة</button>
          <button class="chip" data-insert="🔁 متكررة">تكرار</button>
        </div>
        <div class="compose-row">
          <button class="icon" title="ملصقات">☻</button>
          <button class="icon" title="مرفقات">＋</button>
          <textarea id="composer" placeholder="اكتب رسالة في Nova"></textarea>
          <button class="send" id="sendBtn">➤</button>
        </div>
      </footer>
    </section>

    <aside class="inspector">
      <div class="inspector-top">
        <div class="avatar big" id="profileAvatar" style="--c1:#1d9bf0;--c2:#7357ff">ن</div>
        <h2 id="profileName">Nova</h2>
        <p class="muted" id="profileBio">منصة اجتماعية موحدة</p>
      </div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </main>

  <section class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Nova</h2>
        <button class="icon" id="closeModal">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </section>

  <script>
    const state = {
      user: { name: "أكرم", account: "ضيف", stars: 12450, premium: false },
      activeSurface: "home",
      activeConversation: 1,
      filter: "all",
      authMode: "phone"
    };

    const nav = [
      ["home", "⌂", "الرئيسية"],
      ["chats", "✉", "المحادثات"],
      ["groups", "◆", "المجموعات"],
      ["channels", "◉", "القنوات"],
      ["calls", "☎", "المكالمات"],
      ["reels", "▶", "الريلز"],
      ["profiles", "♙", "الملفات"],
      ["communities", "◇", "المجتمعات"],
      ["ai", "✦", "Nova AI"]
    ];

    const conversations = [
      { id: 1, type: "direct", name: "مريم النور", status: "متصلة الآن", preview: "أرسلت ملف التصميم.", unread: 2, colors: ["#1d9bf0", "#19a974"], initials: "م", messages: [
        ["them", "مرحبا، هذه واجهة Nova الجديدة."],
        ["me", "جميل. أريد تسجيل دخول ومحادثات ومكالمات وريلز."],
        ["them", "تم تجهيز صفحة رئيسية ولوحة إدارة وقاعدة بيانات."]
      ] },
      { id: 2, type: "group", name: "فريق المنتج", status: "18 عضوًا · 6 متصلون", preview: "استطلاع وخطة مهام.", unread: 5, colors: ["#e94b7b", "#7357ff"], initials: "ف", messages: [
        ["them", "سارة: التصويت على أولوية الإطلاق جاهز."],
        ["me", "أضيفوا قوائم المهام ووسوم الأعضاء."],
        ["them", "تم إنشاء Topic خاص بالمكالمات."]
      ] },
      { id: 3, type: "channel", name: "قناة Nova", status: "128K مشترك", preview: "منشور مجدول وبث مباشر.", unread: 1, colors: ["#19a974", "#f4a62a"], initials: "ن", messages: [
        ["them", "قناة Nova تدعم النصوص والصور والفيديو والبث المباشر."],
        ["me", "جهزوا إحصائيات القناة وجدولة المنشورات."]
      ] },
      { id: 4, type: "group", name: "مجتمع المطورين", status: "4 قنوات · 12 مجموعة", preview: "غرفة صوتية تبدأ الليلة.", unread: 0, colors: ["#7357ff", "#1d9bf0"], initials: "م", messages: [
        ["them", "فعالية Flutter + NestJS تبدأ الساعة 9."],
        ["me", "أرسلوا تنبيهًا لكل الأعضاء."]
      ] }
    ];

    const surfaces = {
      home: {
        title: "الرئيسية",
        status: "لوحة تشغيل Nova",
        html: () => `<div class="surface-grid">
          ${card("تسجيل الدخول", "هاتف، بريد، Google، Apple، وضيف 30 يومًا")}
          ${card("المحادثات", "نص، صور، فيديو، ملفات، صوت، تعديل، حذف، ترجمة")}
          ${card("المجموعات", "مواضيع، أدوار، صلاحيات، استطلاعات، مهام، وسوم")}
          ${card("القنوات", "نشر وجدولة وبث مباشر وإحصائيات")}
          ${card("المكالمات", "صوت، فيديو، جماعية، شاشة، تشفير، ملخص AI")}
          ${card("Nova Stars", "هدايا، دعم، زخارف، ألوان، شارات")}
        </div>`
      },
      calls: {
        title: "المكالمات",
        status: "صوت وفيديو وجماعية",
        html: () => `<div class="surface-grid">
          ${card("مكالمة صوتية", "تشفير كامل، جودة عالية، تسجيل ملخص AI")}
          ${card("مكالمة فيديو", "كاميرا، مشاركة شاشة، ضيوف")}
          ${card("غرفة جماعية", "حتى 128 مشاركًا، أدوار مضيفين")}
          ${card("ملخص AI", "نقاط القرار، المهام، الكلمات المفتاحية")}
        </div>`
      },
      reels: {
        title: "الريلز",
        status: "فيديو قصير وخوارزمية اقتراح",
        html: () => `<div class="surface-grid">
          <div class="video-tile"><h2>Nova Reel</h2><p>إعجاب · تعليق · مشاركة · حفظ</p></div>
          <div class="video-tile" style="background:linear-gradient(180deg,transparent,rgba(0,0,0,.58)),linear-gradient(135deg,#19a974,#1d9bf0)"><h2>For You</h2><p>اقتراح حسب التفاعل والاهتمامات</p></div>
          <div class="video-tile" style="background:linear-gradient(180deg,transparent,rgba(0,0,0,.58)),linear-gradient(135deg,#f4a62a,#e94b7b)"><h2>Creator</h2><p>إحصائيات وحفظ ومشاركة</p></div>
        </div>`
      },
      profiles: {
        title: "الملفات الشخصية",
        status: "هوية، إنجازات، جوائز، شارات",
        html: () => `<div class="surface-grid">
          ${card("فيديو تعريفي", "مقطع قصير أعلى الملف")}
          ${card("موسيقى مفضلة", "تعرض في الملف والحالات")}
          ${card("إنجازات", "مستويات ومهام وشارات")}
          ${card("جوائز", "هدايا Nova Stars وحملات")}
        </div>`
      },
      notifications: {
        title: "الإشعارات",
        status: "Firebase Push جاهز في الخطة",
        html: () => `<div class="surface-grid">
          ${card("رسائل", "7 غير مقروءة")}
          ${card("مكالمات", "ملخص مكالمة جاهز")}
          ${card("قنوات", "منشور مجدول نُشر")}
          ${card("أمان", "تسجيل دخول من جهاز جديد")}
        </div>`
      },
      admin: {
        title: "لوحة الإدارة",
        status: "إدارة المستخدمين والبلاغات والمحتوى",
        html: () => `<div class="surface-grid">
          ${card("المستخدمون", "2.4M نشط")}
          ${card("البلاغات", "318 مفتوح")}
          ${card("المحتوى", "فحص ريلز وقنوات")}
          ${card("النجوم", "94K معاملة اليوم")}
          ${card("الاشتراكات", "18% نمو Premium")}
          ${card("الإحصائيات", "Retention وDAU وMAU")}
        </div>`
      },
      communities: {
        title: "المجتمعات",
        status: "قنوات ومجموعات وغرف وفعاليات",
        html: () => `<div class="surface-grid">
          ${card("مجتمع Nova Devs", "4 قنوات · 12 مجموعة · غرفتان صوتيتان")}
          ${card("فعاليات", "تقويم حضور وتنبيهات")}
          ${card("غرف صوتية", "مضيفون ومشاركة شاشة")}
          ${card("أدوار", "مالك، مشرف، عضو، ضيف")}
        </div>`
      },
      ai: {
        title: "Nova AI",
        status: "مساعد ذكي مدمج",
        html: () => `<div class="surface-grid">
          ${card("تلخيص المحادثات", "ملخص + قرارات + مهام")}
          ${card("كتابة الردود", "نبرة رسمية أو ودية")}
          ${card("الترجمة", "رسائل وقنوات وريلز")}
          ${card("الصوت إلى نص", "رسائل صوتية ومكالمات")}
          ${card("إنشاء منشورات", "قنوات وحالات")}
          ${card("بحث داخل الحساب", "ملفات ورسائل ووسائط")}
        </div>`
      }
    };

    function card(title, body) {
      return `<article class="surface-card"><h3>${title}</h3><p class="muted">${body}</p><button class="chip">فتح</button></article>`;
    }

    function renderNav() {
      document.getElementById("mainNav").innerHTML = nav.map(([id, icon, title]) =>
        `<button class="icon ${state.activeSurface === id ? "active" : ""}" title="${title}" data-surface="${id}">${icon}</button>`
      ).join("");
    }

    function renderList() {
      const q = document.getElementById("globalSearch").value.trim().toLowerCase();
      const rows = conversations.filter(c => (state.filter === "all" || c.type === state.filter) && (!q || `${c.name} ${c.preview}`.toLowerCase().includes(q)));
      document.getElementById("conversationList").innerHTML = rows.map(c => `
        <button class="item ${state.activeConversation === c.id ? "active" : ""}" data-conversation="${c.id}">
          <div class="avatar" style="--c1:${c.colors[0]};--c2:${c.colors[1]}">${c.initials}</div>
          <div class="main-text"><div class="row"><span class="name">${c.name}</span><span class="muted">${c.unread ? c.unread : "✓✓"}</span></div><p class="preview">${c.preview}</p></div>
          <span class="muted">${c.type}</span>
        </button>
      `).join("");
    }

    function renderConversation() {
      const c = conversations.find(item => item.id === state.activeConversation) || conversations[0];
      document.getElementById("activeTitle").textContent = c.name;
      document.getElementById("activeStatus").textContent = c.status;
      document.getElementById("activeAvatar").textContent = c.initials;
      document.getElementById("activeAvatar").style.setProperty("--c1", c.colors[0]);
      document.getElementById("activeAvatar").style.setProperty("--c2", c.colors[1]);
      document.getElementById("profileAvatar").textContent = c.initials;
      document.getElementById("profileAvatar").style.setProperty("--c1", c.colors[0]);
      document.getElementById("profileAvatar").style.setProperty("--c2", c.colors[1]);
      document.getElementById("profileName").textContent = c.name;
      document.getElementById("profileBio").textContent = c.status;
      document.getElementById("content").innerHTML = c.messages.map(([from, text], index) => `
        <article class="message ${from === "me" ? "me" : ""}">
          <div>${text}</div>
          <div class="message-tools">
            <button class="mini">👍</button><button class="mini">❤️</button><button class="mini">تعديل</button><button class="mini">حذف</button><button class="mini">ترجمة</button><button class="mini">تثبيت</button>
          </div>
        </article>
      `).join("");
      renderInspector(c);
    }

    function renderSurface(id) {
      const surface = surfaces[id] || surfaces.home;
      document.getElementById("activeTitle").textContent = surface.title;
      document.getElementById("activeStatus").textContent = surface.status;
      document.getElementById("content").innerHTML = surface.html();
      document.getElementById("profileName").textContent = surface.title;
      document.getElementById("profileBio").textContent = surface.status;
      document.getElementById("inspectorBody").innerHTML = `
        <section class="section"><div class="section-title"><span>جاهزية النظام</span><strong>Prototype</strong></div>
        <div class="card-grid">${card("API", "NestJS contracts")}${card("DB", "PostgreSQL schema")}${card("Realtime", "Socket.IO")}${card("Push", "Firebase plan")}</div></section>
      `;
    }

    function renderInspector(c) {
      document.getElementById("inspectorBody").innerHTML = `
        <section class="section"><div class="section-title"><span>الميزات</span><strong>${c.type}</strong></div>
          <div class="card-grid">
            ${card("ملفات", "صور، فيديو، مستندات")}
            ${card("أمان", "E2EE و2FA وجلسات")}
            ${card("AI", "تلخيص وترجمة")}
            ${card("جدولة", "رسائل ومنشورات")}
          </div>
        </section>
        <section class="section"><div class="section-title"><span>Nova Stars</span><strong>${state.user.stars}</strong></div></section>
      `;
    }

    function openModal(title, html) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = html;
      document.getElementById("modal").classList.add("open");
    }

    function boot() {
      renderNav();
      renderList();
      renderConversation();
      document.querySelectorAll("[data-auth]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-auth]").forEach(item => item.classList.remove("active"));
          btn.classList.add("active");
          state.authMode = btn.dataset.auth;
          document.getElementById("authLabel").textContent = state.authMode === "email" ? "البريد الإلكتروني" : state.authMode === "guest" ? "اسم الضيف" : state.authMode === "oauth" ? "Google / Apple" : "رقم الهاتف";
          document.getElementById("authInput").placeholder = state.authMode === "email" ? "name@example.com" : state.authMode === "oauth" ? "اختر المزود من التطبيق الحقيقي" : "+966 5X XXX XXXX";
        });
      });
      document.getElementById("loginBtn").addEventListener("click", () => document.getElementById("authScreen").classList.add("hidden"));
      document.getElementById("guestBtn").addEventListener("click", () => {
        state.user.account = "ضيف";
        document.getElementById("authScreen").classList.add("hidden");
        openModal("حساب ضيف", `<p class="muted">تم إنشاء حساب ضيف مؤقت صالح 30 يومًا، مع مهلة ربط 15 يومًا بعد الانتهاء.</p>`);
      });
      document.body.addEventListener("click", event => {
        const surface = event.target.closest("[data-surface]");
        if (surface) {
          state.activeSurface = surface.dataset.surface;
          renderNav();
          if (["chats", "groups", "channels"].includes(state.activeSurface)) renderConversation();
          else renderSurface(state.activeSurface);
        }
        const conv = event.target.closest("[data-conversation]");
        if (conv) {
          state.activeConversation = Number(conv.dataset.conversation);
          state.activeSurface = "chats";
          renderNav();
          renderList();
          renderConversation();
        }
        const insert = event.target.closest("[data-insert]");
        if (insert) {
          const box = document.getElementById("composer");
          box.value = box.value ? `${box.value} ${insert.dataset.insert}` : insert.dataset.insert;
          box.focus();
        }
      });
      document.getElementById("sendBtn").addEventListener("click", () => {
        const box = document.getElementById("composer");
        const text = box.value.trim();
        if (!text) return;
        const c = conversations.find(item => item.id === state.activeConversation);
        c.messages.push(["me", text]);
        c.preview = text;
        box.value = "";
        renderList();
        renderConversation();
      });
      document.getElementById("globalSearch").addEventListener("input", renderList);
      document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(item => item.classList.remove("active"));
        btn.classList.add("active");
        renderList();
      }));
      document.getElementById("createBtn").addEventListener("click", () => openModal("إنشاء جديد", `<div class="surface-grid">${card("محادثة", "ابدأ محادثة خاصة")}${card("مجموعة", "أدوار ومواضيع ومهام")}${card("قناة", "نشر وبث وإحصائيات")}${card("مجتمع", "قنوات وغرف وفعاليات")}</div>`));
      document.getElementById("aiBtn").addEventListener("click", () => renderSurface("ai"));
      document.getElementById("closeModal").addEventListener("click", () => document.getElementById("modal").classList.remove("open"));
      document.getElementById("callBtn").addEventListener("click", () => openModal("مكالمة صوتية", `<p class="muted">مكالمة مشفرة بالكامل مع تلخيص AI بعد الانتهاء.</p>`));
      document.getElementById("videoBtn").addEventListener("click", () => openModal("مكالمة فيديو", `<p class="muted">فيديو جماعي مع مشاركة شاشة.</p>`));
      document.getElementById("screenBtn").addEventListener("click", () => openModal("مشاركة الشاشة", `<p class="muted">جاهزة ضمن بوابة المكالمات في Backend.</p>`));
    }

    boot();
  </script>
</body>
</html>
